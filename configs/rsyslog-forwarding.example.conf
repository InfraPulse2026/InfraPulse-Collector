# Fragment for /etc/rsyslog.d/60-infrapulse.conf, rsyslog 8.x.
# Replace hostnames/paths with corporate PKI values; no Agent is needed here.
# The spool directory must exist and be writable by the rsyslog service user.
# Set global TLS defaults once; merge with existing global configuration.
global(
  workDirectory="/var/spool/rsyslog"
  DefaultNetstreamDriverCAFile="/etc/rsyslog.d/infrapulse/collector-ca.crt"
  DefaultNetstreamDriverCertFile="/etc/rsyslog.d/infrapulse/sender.crt"
  DefaultNetstreamDriverKeyFile="/etc/rsyslog.d/infrapulse/sender.key"
)

action(
  type="omfwd"
  target="collector.company.example"
  port="6514"
  protocol="tcp"
  template="RSYSLOG_SyslogRFC5424Format"
  TCP_Framing="octet-counted"
  StreamDriver="gtls"
  StreamDriverMode="1"
  StreamDriverAuthMode="x509/name"
  StreamDriverPermittedPeers="collector.company.example"
  action.resumeRetryCount="-1"
  action.resumeInterval="5"
  action.resumeIntervalMax="60"
  queue.type="LinkedList"
  queue.filename="infrapulse-forward"
  queue.size="10000"
  queue.highWatermark="8000"
  queue.lowWatermark="2000"
  queue.maxDiskSpace="1g"
  queue.saveOnShutdown="on"
)

# Requires the rsyslog GnuTLS module supplied by the distribution.
# For older rsyslog without RSYSLOG_SyslogRFC5424Format, use the built-in
# RSYSLOG_SyslogProtocol23Format; its trailing LF is inside the counted payload.
# Disk-assisted buffering has finite bounds and a volatile RAM portion.
# TCP/TLS has no per-record application ACK; this is not exactly-once delivery.
# Validate the complete installed configuration with: rsyslogd -N1
