# Collector hosting on Windows/macOS/Linux; local collection is disabled.
# For SNMP/RouterOS devices and environment references see config.remote.example.yaml.
agent:
  name: collector-dev
  state_dir: ../state
controller:
  address: localhost:9443
security:
  mode: development
local:
  enabled: false
remote:
  concurrency: 4
commands:
  enabled: false
  protected_interfaces: [ether1]
devices: []
